name: Artifact checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-parser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify raw hashes and recompute tables
        run: python tools/reproduce_results.py --check
      - name: Test log parser
        run: python test_analyze_latency_run.py
      - name: Test evidence checks and workspace preparation
        run: python tools/test_artifact_tools.py
      - name: Test experiment protocol and trace evidence handling
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - name: Test source-derived trace observations
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test diagnostic trace collection and analysis fixtures
        run: python -m unittest discover -s experiments/tests -p 'test_*.py' -v

  kernel-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install distribution build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev linux-headers-generic
      - name: Compile four variants without loading a device
        run: |
          FW_HEADERS="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)"
          test -n "$FW_HEADERS"
          KERNELDIR="$FW_HEADERS" bash tools/check_kernel_build.sh
